<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Legende Zyklus 1 (5–7 Jahre) – Papercraft-KI, MIT-Lizenz
  Icons für Kinder, die noch nicht lesen; die grauen Wörter sind ein Hinweis für die
  begleitende erwachsene Person (Textobjekte mit class «hinweis», dürfen gelöscht werden).

  Linienkodierung wie README «Schritt 4» / docs/WORKFLOW.md:
    Schnittlinie  #000000 durchgezogen 0,8 mm
    Bergfalte     #E74C3C gestrichelt 5,3
    Talfalte      #2E86C1 gestrichelt 3,3
    Klebelasche   #D5D8DC Fläche, Klebetropfen
  Die Strichmuster sind auf die 18-mm-Musterlinie gestreckt, damit sie mit einem Strich enden.

  Nutzung in Inkscape: Gruppe «legende-zyklus1» kopieren und auf dem Bogen unten rechts
  einfügen. Zeilen, die auf dem Bogen nicht vorkommen (z. B. Talfalte beim Würfel),
  löschen und die Zeilen darunter um eine Zeilenhöhe nach oben schieben.
  scripts/make_wuerfel_final.py liest diese Datei und macht das automatisch; es nutzt
  dafür data-row-height, data-padding-top und data-padding-bottom und die Zeilen-IDs.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="70mm" height="47mm" viewBox="0 0 70 47">
  <sodipodi:namedview inkscape:document-units="mm"/>
  <g id="legende-zyklus1" inkscape:label="Legende Zyklus 1"
     data-width="70" data-row-height="10" data-padding-top="4" data-padding-bottom="3">
    <rect id="legende-rahmen" x="0" y="0" width="70" height="47" rx="3" ry="3"
          fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.3"/>

    <g id="legende-schneiden" inkscape:label="Schneiden" transform="translate(0,4)">
      <g transform="translate(8,5)" fill="none" stroke="#000000" stroke-linecap="round">
        <circle cx="-2.4" cy="-1.7" r="1.4" stroke-width="0.6"/>
        <circle cx="-2.4" cy="1.7" r="1.4" stroke-width="0.6"/>
        <path d="M -1.2,-0.9 L 4,1.3 M -1.2,0.9 L 4,-1.3" stroke-width="0.9"/>
      </g>
      <path d="M 15,5 L 33,5" fill="none" stroke="#000000" stroke-width="0.8"/>
      <text class="hinweis" style="font-family:Andika,'Comic Neue','DejaVu Sans',sans-serif;font-size:3.2px;fill:#566573" x="36" y="6.1">schneiden</text>
    </g>

    <g id="legende-bergfalte" inkscape:label="Bergfalte" transform="translate(0,14)">
      <path d="M 4.8,7.6 L 8,2.4 L 11.2,7.6 Z" fill="#E74C3C"/>
      <path d="M 15,5 L 33,5" fill="none" stroke="#E74C3C" stroke-width="0.5"
            stroke-dasharray="4.375,2.625"/>
      <text class="hinweis" style="font-family:Andika,'Comic Neue','DejaVu Sans',sans-serif;font-size:3.2px;fill:#566573" x="36" y="6.1">nach hinten falten</text>
    </g>

    <g id="legende-talfalte" inkscape:label="Talfalte" transform="translate(0,24)">
      <path d="M 4.8,2.4 L 11.2,2.4 L 8,7.6 Z" fill="#2E86C1"/>
      <path d="M 15,5 L 33,5" fill="none" stroke="#2E86C1" stroke-width="0.5"
            stroke-dasharray="2.625,2.625"/>
      <text class="hinweis" style="font-family:Andika,'Comic Neue','DejaVu Sans',sans-serif;font-size:3.2px;fill:#566573" x="36" y="6.1">nach vorne falten</text>
    </g>

    <g id="legende-kleben" inkscape:label="Kleben" transform="translate(0,34)">
      <path d="M 0,-0.5 C 0.17,-0.25 0.32,-0.07 0.32,0.13 A 0.32,0.32 0 0 1 -0.32,0.13 C -0.32,-0.07 -0.17,-0.25 0,-0.5 Z"
            transform="translate(8,5) scale(7)" fill="#FFFFFF" stroke="#566573"
            stroke-width="0.057" stroke-linejoin="round"/>
      <path d="M 15,8.5 L 19.5,1.5 L 28.5,1.5 L 33,8.5 Z" fill="#D5D8DC" stroke="#BDC3C7"
            stroke-width="0.2"/>
      <path d="M 0,-0.5 C 0.17,-0.25 0.32,-0.07 0.32,0.13 A 0.32,0.32 0 0 1 -0.32,0.13 C -0.32,-0.07 -0.17,-0.25 0,-0.5 Z"
            transform="translate(24,5) scale(4.6)" fill="#FFFFFF" stroke="#566573"
            stroke-width="0.087" stroke-linejoin="round"/>
      <text class="hinweis" style="font-family:Andika,'Comic Neue','DejaVu Sans',sans-serif;font-size:3.2px;fill:#566573" x="36" y="6.1">Leim hierhin</text>
    </g>
  </g>
</svg>
