<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="140" fill="#f8f9fa" rx="8"/>
  
  <!-- Step 1 -->
  <rect x="20" y="20" width="140" height="100" fill="#1B4F72" rx="8"/>
  <text x="90" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1. Generieren</text>
  <text x="90" y="75" text-anchor="middle" fill="#AED6F1" font-size="10">TripoSR</text>
  <text x="90" y="90" text-anchor="middle" fill="#AED6F1" font-size="10">ComfyUI</text>
  <text x="90" y="105" text-anchor="middle" fill="#AED6F1" font-size="10">Blockbench</text>
  
  <!-- Arrow 1 -->
  <polygon points="170,70 190,55 190,65 210,65 210,75 190,75 190,85" fill="#E67E22"/>
  
  <!-- Step 2 -->
  <rect x="200" y="20" width="140" height="100" fill="#2E86C1" rx="8"/>
  <text x="270" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2. Vereinfachen</text>
  <text x="270" y="75" text-anchor="middle" fill="#D6EAF8" font-size="10">Blender</text>
  <text x="270" y="90" text-anchor="middle" fill="#D6EAF8" font-size="10">Decimate (Planar)</text>
  
  <!-- Arrow 2 -->
  <polygon points="350,70 370,55 370,65 390,65 390,75 370,75 370,85" fill="#E67E22"/>
  
  <!-- Step 3 -->
  <rect x="380" y="20" width="140" height="100" fill="#2874A6" rx="8"/>
  <text x="450" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3. Entfalten</text>
  <text x="450" y="75" text-anchor="middle" fill="#D6EAF8" font-size="10">Blender</text>
  <text x="450" y="90" text-anchor="middle" fill="#D6EAF8" font-size="10">Paper Model</text>
  
  <!-- Arrow 3 -->
  <polygon points="530,70 550,55 550,65 570,65 570,75 550,75 550,85" fill="#E67E22"/>
  
  <!-- Step 4 -->
  <rect x="560" y="20" width="140" height="100" fill="#1A5276" rx="8"/>
  <text x="630" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">4. Gestalten</text>
  <text x="630" y="75" text-anchor="middle" fill="#D6EAF8" font-size="10">Inkscape</text>
  <text x="630" y="90" text-anchor="middle" fill="#D6EAF8" font-size="10">Tabgen</text>
  
  <!-- Arrow 4 -->
  <polygon points="710,70 730,55 730,65 750,65 750,75 730,75 730,85" fill="#E67E22"/>
  
  <!-- Step 5 -->
  <rect x="740" y="20" width="140" height="100" fill="#27AE60" rx="8"/>
  <text x="810" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">5. Bauen!</text>
  <text x="810" y="75" text-anchor="middle" fill="#D5F5E3" font-size="10">Drucken</text>
  <text x="810" y="90" text-anchor="middle" fill="#D5F5E3" font-size="10">Schneiden</text>
  <text x="810" y="105" text-anchor="middle" fill="#D5F5E3" font-size="10">Falten + Kleben</text>
</svg>
